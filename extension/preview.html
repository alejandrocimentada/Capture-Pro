<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Component preview</title>
  <style>
    :root { color-scheme: light; --line: #E7E5E4; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: #FAFAF9; color: #1C1917;
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px;
      background: #FFFFFF; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; min-width: 0; }
    .brand small { color: #78716C; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .logo { flex: none; width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, #F97316, #FB7185); }
    .actions { display: flex; align-items: center; gap: 8px; }
    .seg { display: flex; padding: 2px; border-radius: 8px; background: #F5F5F4; border: 1px solid var(--line); }
    .seg button { border: none; background: none; color: #78716C; font: 600 12px system-ui, sans-serif; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
    .seg button.active { background: #FFFFFF; color: #1C1917; box-shadow: 0 1px 2px rgba(28,25,23,.12); }
    .ghost { border: 1px solid var(--line); background: #FFFFFF; color: #1C1917; font: 600 12px system-ui, sans-serif;
      padding: 7px 12px; border-radius: 8px; cursor: pointer; }
    .ghost:hover { background: #F5F5F4; }

    main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 44%); }
    body.no-code main { grid-template-columns: 1fr; }
    body.no-code aside { display: none; }
    .stage { min-width: 0; min-height: 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }

    aside { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #FFFFFF; border-left: 1px solid var(--line); }
    .code-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px 8px 14px;
      background: #FAFAF9; border-bottom: 1px solid var(--line); }
    .file { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .file small { margin-left: 8px; color: #A8A29E; font-weight: 400; }
    #copy { border: none; padding: 7px 12px; border-radius: 8px; background: linear-gradient(135deg, #F97316, #FB7185);
      color: #fff; font: 600 12px system-ui, sans-serif; cursor: pointer; box-shadow: 0 4px 12px rgba(249,115,22,.25); }
    .code-body { flex: 1; min-height: 0; overflow: auto; display: flex; font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .code-body pre { margin: 0; padding: 12px 0; }
    #gutter { flex: none; padding: 12px 12px 12px 14px; text-align: right; color: #A8A29E; user-select: none;
      border-right: 1px solid var(--line); position: sticky; left: 0; background: #FFFFFF; }
    #src { padding: 12px 16px; color: #292524; white-space: pre; tab-size: 2; }

    /* syntax colors (light theme) */
    .t-com { color: #A8A29E; font-style: italic; }
    .t-tag { color: #0369A1; }
    .t-punc { color: #78716C; }
    .t-attr { color: #B45309; }
    .t-str { color: #15803D; }
    .t-sel { color: #C2410C; }
    .t-at { color: #BE185D; }
    .t-prop { color: #0369A1; }
    .t-val { color: #15803D; }

    .empty { padding: 48px; text-align: center; color: #78716C; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo"></div>Capture Pro <small id="label">Preview</small></div>
    <div class="actions">
      <div class="seg" id="bg">
        <button data-bg="#ffffff" class="active">Light</button>
        <button data-bg="#f3f4f6">Grey</button>
        <button data-bg="#0b0d12">Dark</button>
      </div>
      <button id="toggleCode" class="ghost">Hide code</button>
    </div>
  </header>
  <main>
    <section class="stage"><iframe id="frame" sandbox title="Component preview"></iframe></section>
    <aside>
      <div class="code-head">
        <span class="file">component.html <small id="meta"></small></span>
        <button id="copy">Copy code</button>
      </div>
      <div class="code-body">
        <pre id="gutter"></pre>
        <pre id="src"></pre>
      </div>
    </aside>
  </main>
  <script src="preview.js"></script>
</body>
</html>
