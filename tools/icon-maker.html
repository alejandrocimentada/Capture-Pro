<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Capture Pro · icon maker</title>
  <style>
    body { margin: 40px; background: #FAFAF9; color: #1C1917; font: 14px/1.5 system-ui, sans-serif; }
    .row { display: flex; gap: 20px; margin: 24px 0; }
    .tile { display: flex; gap: 16px; align-items: flex-end; padding: 20px; border-radius: 14px; }
    .light { background: #fff; border: 1px solid #E7E5E4; }
    .dark { background: #202124; }
    button { padding: 10px 16px; border: none; border-radius: 8px; font: 600 13px system-ui, sans-serif; cursor: pointer;
      color: #fff; background: linear-gradient(135deg, #F97316, #FB7185); margin-right: 8px; }
    code { background: #F5F5F4; padding: 2px 6px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>Capture Pro icons</h1>
  <p>Click the buttons, then move <code>icon16.png</code>, <code>icon32.png</code>, <code>icon48.png</code>, <code>icon128.png</code>
     into <code>extension/icons/</code>. Keep <code>icon512.png</code>, <code>icon32.png</code>, and <code>logo.svg</code> for the website (<code>docs/</code>).</p>
  <div class="row"><div class="tile light" id="light"></div><div class="tile dark" id="dark"></div></div>
  <button id="png">Download PNG icons</button>
  <button id="svg">Download logo.svg</button>

  <script>
    const SIZES = [16, 32, 48, 128, 512];

    function draw(ctx, s) {
      const g = ctx.createLinearGradient(0, 0, s, s);
      g.addColorStop(0, '#F97316');
      g.addColorStop(1, '#FB7185');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.roundRect(0, 0, s, s, s * 0.26); ctx.fill();
      // selection corners
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = Math.max(1.5, s * 0.07);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const a = s * 0.24, b = s * 0.76, l = s * 0.16;
      ctx.beginPath();
      ctx.moveTo(a, a + l); ctx.lineTo(a, a); ctx.lineTo(a + l, a);
      ctx.moveTo(b - l, a); ctx.lineTo(b, a); ctx.lineTo(b, a + l);
      ctx.moveTo(b, b - l); ctx.lineTo(b, b); ctx.lineTo(b - l, b);
      ctx.moveTo(a + l, b); ctx.lineTo(a, b); ctx.lineTo(a, b - l);
      ctx.stroke();
      // the component block
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.roundRect(s * 0.37, s * 0.37, s * 0.26, s * 0.26, s * 0.05); ctx.fill();
    }

    function make(s) {
      const c = document.createElement('canvas');
      c.width = c.height = s;
      draw(c.getContext('2d'), s);
      return c;
    }

    function save(blob, name) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    for (const id of ['light', 'dark']) for (const s of [16, 32, 48, 128]) document.getElementById(id).append(make(s));

    document.getElementById('png').onclick = async () => {
      for (const s of SIZES) {
        const blob = await new Promise((r) => make(s).toBlob(r));
        save(blob, `icon${s}.png`);
        await new Promise((r) => setTimeout(r, 300));
      }
    };

    const SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F97316"/><stop offset="1" stop-color="#FB7185"/></linearGradient></defs>
  <rect width="64" height="64" rx="16.6" fill="url(#g)"/>
  <path d="M15.36 25.6V15.36H25.6M38.4 15.36h10.24V25.6M48.64 38.4v10.24H38.4M25.6 48.64H15.36V38.4" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="23.68" y="23.68" width="16.64" height="16.64" rx="3.2" fill="#fff"/>
</svg>`;
    document.getElementById('svg').onclick = () => save(new Blob([SVG], { type: 'image/svg+xml' }), 'logo.svg');
  </script>
</body>
</html>
